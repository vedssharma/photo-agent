[project]
name = "photo-agent-server"
version = "0.1.0"
description = "Backend for photo-agent: agent service, edit graph, and render engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_agent"]
