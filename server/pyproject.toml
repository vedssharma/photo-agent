[project]
name = "photo-agent-server"
version = "0.1.0"
description = "Backend for photo-agent: agent service, edit graph, and render engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "c2pa-python>=0.38",
    "cryptography>=45",
    "fastapi>=0.115",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Open-source models for AI edits (Phases 3 and 4). Without them, each task uses its classical
# computer-vision fallback. Install with `uv sync --extra models`.
models = [
    "accelerate>=1.0",
    "diffusers>=0.35",
    "einops>=0.8",
    "huggingface-hub>=0.30",
    "kornia>=0.7",
    "onnxruntime>=1.20",
    "spandrel>=0.4",
    "spandrel-extra-arches>=0.2",
    "timm>=1.0",
    "torch>=2.5",
    "transformers>=4.57",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_agent"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Optional model packages (the `models` extra) are not installed in CI.
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "onnxruntime",
    "huggingface_hub",
    "diffusers",
    "diffusers.*",
    "safetensors",
    "spandrel",
    "spandrel_extra_arches",
    "safetensors.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# c2pa-python ships no type information.
module = ["c2pa", "c2pa.*"]
ignore_missing_imports = true
